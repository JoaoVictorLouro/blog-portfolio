services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${PORT:-2368}:80'
    depends_on:
      ghost:
        condition: service_healthy
      content-api:
        condition: service_healthy
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./content/public/humans.txt:/usr/share/nginx/html/humans.txt:ro

  ghost:
    build:
      context: .
      args:
        MATERIAL_SYMBOLS_CACHEBUST: ${MATERIAL_SYMBOLS_CACHEBUST:-0}
    image: ghcr.io/joaovictorlouro/blog-portfolio:latest
    restart: unless-stopped
    expose:
      - '2368'
    env_file:
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      NODE_ENV: development
      url: ${URL:-http://localhost:2368}
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      database__useNullAsDefault: 'true'
      security__staffDeviceVerification: 'false'
    volumes:
      - ./data/content:/var/lib/ghost/content
      - ./content/themes:/var/lib/ghost/content/themes
      - ./content/settings:/var/lib/ghost/content/settings
      - ./content/settings/redirects.yaml:/var/lib/ghost/content/data/redirects.yaml
      - ./content/public:/var/lib/ghost/content/public
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:2368/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  bootstrap:
    build:
      context: .
      args:
        MATERIAL_SYMBOLS_CACHEBUST: ${MATERIAL_SYMBOLS_CACHEBUST:-0}
    image: ghcr.io/joaovictorlouro/blog-portfolio:latest
    restart: 'no'
    network_mode: service:ghost
    depends_on:
      ghost:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      URL: ${URL:-http://localhost:2368}
      GHOST_ADMIN_NAME: ${GHOST_ADMIN_NAME:-Admin}
      GHOST_SITE_TITLE: ${GHOST_SITE_TITLE:-Kono Gaijin}
      CONTENT_API_WEBHOOK_SECRET: ${CONTENT_API_WEBHOOK_SECRET:-}
      CONTENT_API_WEBHOOK_TARGET_URL: ${CONTENT_API_WEBHOOK_TARGET_URL:-http://content-api:8080/webhooks/ghost}
    volumes:
      - ./scripts/ghost-bootstrap.mjs:/ghost-bootstrap.mjs:ro
      - ./scripts/i18n:/i18n:ro
      - ./content/themes/neon-protocol/assets/i18n:/var/lib/ghost/content/themes/neon-protocol/assets/i18n
    entrypoint: ['node', '/ghost-bootstrap.mjs']

  content-api:
    build:
      context: .
      dockerfile: content-api/Dockerfile
    image: ghcr.io/joaovictorlouro/blog-portfolio-content-api:latest
    restart: unless-stopped
    depends_on:
      ghost:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      URL: ${URL:-http://localhost:2368}
      GHOST_API_URL: http://ghost:2368
      CONTENT_API_PORT: '8080'
      I18N_REFRESH_MS: '3600000'
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-UCV3h2_srSVaiEmjrZ8v7Qsw}
      YOUTUBE_REFRESH_MS: ${YOUTUBE_REFRESH_MS:-3600000}
    healthcheck:
      test:
        [
          'CMD',
          'deno',
          'eval',
          "const r=await fetch('http://127.0.0.1:8080/health');process.exit(r.ok?0:1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
