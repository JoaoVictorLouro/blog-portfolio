name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ghcr.io/joaovictorlouro/blog-portfolio
            dockerfile: Dockerfile
          - image: ghcr.io/joaovictorlouro/blog-portfolio-content-api
            dockerfile: content-api/Dockerfile
          - image: ghcr.io/joaovictorlouro/blog-portfolio-website-examples
            dockerfile: website-examples/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  refresh-argocd:
    name: Refresh Argo CD
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Argo CD webhook
        env:
          ARGOCD_WEBHOOK_URL: ${{ secrets.ARGOCD_WEBHOOK_URL }}
          ARGOCD_WEBHOOK_SECRET: ${{ secrets.ARGOCD_WEBHOOK_SECRET }}
        run: |
          : "${ARGOCD_WEBHOOK_URL:?Set repository secret ARGOCD_WEBHOOK_URL}"
          : "${ARGOCD_WEBHOOK_SECRET:?Set repository secret ARGOCD_WEBHOOK_SECRET}"
          curl -fsS -X POST "$ARGOCD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${ARGOCD_WEBHOOK_SECRET}" \
            --data '{}'
