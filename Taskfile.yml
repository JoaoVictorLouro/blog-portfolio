version: '3'

dotenv: [.env, .env.secrets]

tasks:
  default:
    cmds:
      - task: up

  setup:
    desc: Create env files from examples if missing and ensure data directory exists
    cmds:
      - |
        if [ ! -f .env ]; then
          cp .env.example .env
          echo "Created .env from .env.example"
        else
          echo ".env already exists"
        fi
        if [ ! -f .env.secrets ]; then
          cp .env.secrets.example .env.secrets
          echo "Created .env.secrets from .env.secrets.example"
          if [ -f .env ]; then
            for key in GHOST_ADMIN_EMAIL GHOST_ADMIN_PASSWORD mail__options__auth__user mail__options__auth__pass CONTENT_API_WEBHOOK_SECRET; do
              line=$(grep -E "^${key}=" .env | tail -n1 || true)
              [ -n "$line" ] || continue
              grep -vE "^${key}=" .env.secrets > .env.secrets.tmp
              printf '%s\n' "$line" >> .env.secrets.tmp
              mv .env.secrets.tmp .env.secrets
            done
          fi
        else
          echo ".env.secrets already exists"
          if ! grep -qE '^CONTENT_API_WEBHOOK_SECRET=' .env.secrets; then
            line=$(grep -E '^CONTENT_API_WEBHOOK_SECRET=' .env.secrets.example | tail -n1 || true)
            if [ -n "$line" ]; then
              printf '%s\n' "$line" >> .env.secrets
              echo "Appended CONTENT_API_WEBHOOK_SECRET to .env.secrets"
            fi
          fi
        fi
      - mkdir -p data/content content/themes content/settings content/public

  up:
    desc: Build and start Ghost in the background
    deps: [setup]
    cmds:
      - deno task build:icons
      - |
        export MATERIAL_SYMBOLS_CACHEBUST="$(cksum scripts/build-material-symbols-subset.sh | awk '{print $1 "-" $2}')"
        docker compose up -d --build

  down:
    desc: Stop Ghost
    cmds:
      - docker compose down

  logs:
    desc: Follow nginx and Ghost container logs
    cmds:
      - docker compose logs -f nginx ghost

  logs:api:
    desc: Follow content-api container logs
    cmds:
      - docker compose logs -f content-api

  logs:nginx:
    desc: Follow nginx container logs
    cmds:
      - docker compose logs -f nginx

  status:
    desc: Show Compose service status
    cmds:
      - docker compose ps

  update:
    desc: Pull base images, rebuild, and restart
    cmds:
      - deno task build:icons
      - docker compose pull
      - |
        export MATERIAL_SYMBOLS_CACHEBUST="$(cksum scripts/build-material-symbols-subset.sh | awk '{print $1 "-" $2}')"
        docker compose up -d --build

  recreate:
    desc: Recreate the Ghost container (use after env file changes)
    cmds:
      - deno task build:icons
      - |
        export MATERIAL_SYMBOLS_CACHEBUST="$(cksum scripts/build-material-symbols-subset.sh | awk '{print $1 "-" $2}')"
        docker compose up -d --force-recreate --build ghost

  format:
    desc: Format repo files with Prettier (via Deno)
    cmds:
      - deno task format

  lint:
    desc: Lint neon-protocol Ghost theme with gscan
    cmds:
      - deno task lint

  test:
    desc: Run theme checks and validate Compose config
    cmds:
      - deno task test

  seed-style-review:
    desc: Populate style-review Ghost articles for UI, listing, and search testing
    deps: [setup]
    cmds:
      - deno run -A scripts/seed-style-review-post.mjs
