version: '3'

dotenv: [.env]

tasks:
  default:
    cmds:
      - task: up

  setup:
    desc: Create .env from example if missing and ensure data directory exists
    cmds:
      - |
        if [ ! -f .env ]; then
          cp .env.example .env
          echo "Created .env from .env.example"
        else
          echo ".env already exists"
        fi
      - mkdir -p data/content content/themes content/settings content/public

  up:
    desc: Build and start Ghost in the background
    deps: [setup]
    cmds:
      - docker compose up -d --build

  down:
    desc: Stop Ghost
    cmds:
      - docker compose down

  logs:
    desc: Follow Ghost container logs
    cmds:
      - docker compose logs -f ghost

  status:
    desc: Show Compose service status
    cmds:
      - docker compose ps

  update:
    desc: Pull base images, rebuild, and restart
    cmds:
      - docker compose pull
      - docker compose up -d --build

  recreate:
    desc: Recreate the Ghost container (use after .env changes)
    cmds:
      - docker compose up -d --force-recreate --build ghost

  format:
    desc: Format repo files with Prettier (via Deno)
    cmds:
      - deno task format

  lint:
    desc: Lint Ghost theme with gscan
    cmds:
      - deno task lint

  test:
    desc: Run theme checks and validate Compose config
    cmds:
      - deno task test
