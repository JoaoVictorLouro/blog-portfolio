routes:
  /:
    template: locale-detect
  /en-us/:
    template: home-en-us
  /ja-jp/:
    template: home-ja-jp
  /pt-br/:
    template: home-pt-br
  /es-la/:
    template: home-es-la
  /en-us/about/:
    template: custom-about-en-us
    data: page.about-en-us
  /ja-jp/about/:
    template: custom-about-ja-jp
    data: page.about-ja-jp
  /pt-br/about/:
    template: custom-about-pt-br
    data: page.about-pt-br
  /es-la/about/:
    template: custom-about-es-la
    data: page.about-es-la
  /en-us/portfolio/:
    template: portfolio-en-us
  /ja-jp/portfolio/:
    template: portfolio-ja-jp
  /pt-br/portfolio/:
    template: portfolio-pt-br
  /es-la/portfolio/:
    template: portfolio-es-la

collections:
  /en-us/articles/:
    permalink: /en-us/articles/{slug}/
    template: index-en-us
    filter: tag:-hash-lang-ja-jp+tag:-hash-lang-pt-br+tag:-hash-lang-es-la
  /ja-jp/articles/:
    permalink: /ja-jp/articles/{slug}/
    template: index-ja-jp
    filter: tag:hash-lang-ja-jp
  /pt-br/articles/:
    permalink: /pt-br/articles/{slug}/
    template: index-pt-br
    filter: tag:hash-lang-pt-br
  /es-la/articles/:
    permalink: /es-la/articles/{slug}/
    template: index-es-la
    filter: tag:hash-lang-es-la

taxonomies:
  tag: /en-us/tag/{slug}/
  author: /author/{slug}/
